name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: latex-sft data verify --data-version v5.2
      - run: python -m build
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packages/cli
            src/latex_sft/core/resources
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - run: npm install --prefix "$RUNNER_TEMP/cli-install" --ignore-scripts "$RUNNER_TEMP/qwen-latex-cli-0.1.0.tgz"
      - run: node "$RUNNER_TEMP/cli-install/node_modules/qwen-latex-cli/bin/qwen-latex.js" --help
