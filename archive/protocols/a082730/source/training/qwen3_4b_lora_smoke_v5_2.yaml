### model
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
trust_remote_code: true
flash_attn: sdpa

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### dataset
dataset_dir: training/data/v5.2
dataset: latex_formula_train
eval_dataset: latex_formula_eval_clean
template: qwen3_nothink
cutoff_len: 1024
max_samples: 64
overwrite_cache: true
preprocessing_num_workers: 2

### output
output_dir: saves/qwen3-4b-latex-correction/lora/smoke-v5.2
logging_steps: 1
save_strategy: steps
save_steps: 5
save_total_limit: 1
plot_loss: false
overwrite_output_dir: false
save_only_model: false
load_best_model_at_end: false

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.5e-5
max_steps: 5
lr_scheduler_type: cosine
warmup_ratio: 0.05
# The experiment entry point must verify CUDA bf16 support before training.
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 5
